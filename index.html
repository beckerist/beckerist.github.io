<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>beckerist // github</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            :root {
                --dark-blue: #102030;
                --medium-blue: #1a3a5a;
                --light-blue: #2d5d7d;
                --grey-light: #eaeaf0;
                --grey-dark: #3a4a5a;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background-color: var(--dark-blue);
                color: var(--grey-light);
                font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .container-links {
                width: 100%;
                max-width: 600px;
            }
            .header {
                text-align: center;
                margin-bottom: 40px;
            }
            .header h1 {
                font-size: 2.5rem;
                font-weight: 300;
                letter-spacing: 1px;
                margin-bottom: 10px;
                color: var(--grey-light);
            }
            .header p {
                font-size: 0.95rem;
                color: var(--grey-dark);
                letter-spacing: 0.5px;
            }
            .links-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 16px;
            }
            @media (min-width: 576px) {
                .links-grid {
                    grid-template-columns: 1fr 1fr;
                }
            }
            .link-item {
                border: 1px solid var(--grey-dark);
                padding: 24px 20px;
                text-decoration: none;
                color: var(--grey-light);
                transition: all 0.25s ease;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                min-height: 120px;
                background-color: transparent;
                position: relative;
                overflow: hidden;
            }
            .link-item::before {
                content: "";
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background-color: var(--medium-blue);
                transition: left 0.25s ease;
                z-index: -1;
            }
            .link-item:hover {
                border-color: var(--light-blue);
                color: var(--grey-light);
                transform: translateY(-2px);
            }
            .link-item:hover::before {
                left: 0;
            }
            .link-title {
                font-size: 1.1rem;
                font-weight: 500;
                letter-spacing: 0.5px;
                margin-bottom: 6px;
            }
            .link-desc {
                font-size: 0.85rem;
                color: var(--grey-dark);
                transition: color 0.25s ease;
            }
            .link-item:hover .link-desc {
                color: var(--grey-light);
            }
            .footer {
                text-align: center;
                margin-top: 40px;
                font-size: 0.85rem;
                color: var(--grey-dark);
            }
            @media (max-width: 576px) {
                .header h1 {
                    font-size: 2rem;
                }
                .link-item {
                    padding: 20px 16px;
                    min-height: 110px;
                }
                .link-title {
                    font-size: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container-links">
            <div class="header">
                <h1>Links</h1>
                <p>Tools and such</p>
            </div>
            <div class="links-grid">
                <a href="/mixed" class="link-item"
                    ><div class="link-title">Mixed Up Artist Group</div>
                    <div class="link-desc">View the works of some excellent local Syracuse Artists!</div></a>
                <a href="/game1" class="link-item"
                    ><div class="link-title">Flurkit Game Dev Project</div>
                    <div class="link-desc">Code & projects</div></a>
                <a href="/suburpardy" class="link-item"
                    ><div class="link-title">Suburpardy</div>
                    <div class="link-desc">Temporary home during development</div></a>
                
            </div>
            <div class="footer"><p>&copy; 2026. All rights reserved.</p></div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
